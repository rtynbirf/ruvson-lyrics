name: Pages (ручной запуск)

# Публикует карaoke на GitHub Pages.
# Запускается вручную (Actions → Pages → Run workflow).
# Работает, когда репозиторий публичный ИЛИ у аккаунта есть план с Pages
# для приватных репозиториев. Сначала включи Pages:
# Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --check karaoke/app.js && node --check karaoke/engine.js
      - name: Загрузить карaoke как артефакт Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: karaoke
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
